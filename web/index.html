<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sivakesh Raman - premium clarity and counseling experience.">
  <meta name="theme-color" content="#0D0D0D">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sivakesh Raman">
  <link rel="apple-touch-icon" sizes="192x192" href="apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sivakesh Raman</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0D0D0D;
      overflow: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D0D0D;
      z-index: 9999;
      transition: opacity 220ms ease;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: pulseFade 1.8s ease-in-out infinite;
      transform-origin: center;
    }

    .loader-logo {
      width: 84px;
      height: 84px;
      object-fit: contain;
      border-radius: 16px;
    }

    .loader-tagline {
      color: rgba(255, 255, 255, 0.72);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0.2px;
    }

    @keyframes pulseFade {
      0%, 100% {
        opacity: 0.82;
        transform: scale(0.985);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-content">
      <img class="loader-logo" src="logo.png" alt="Clarity" />
      <div class="loader-tagline">Clarity begins here</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
